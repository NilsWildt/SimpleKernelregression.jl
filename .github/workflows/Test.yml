name: Test

on:
  push:
    branches:
      - main
    tags: ["*"]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ReusableTest.yml
    with:
      os: ${{ matrix.os }}
      version: ${{ matrix.version }}
      arch: ${{ matrix.os == 'macos-latest' && 'aarch64' || matrix.arch }}
      allow_failure: ${{ matrix.allow_failure }}
      run_codecov: ${{ matrix.version == '1' && matrix.os == 'ubuntu-latest' }}
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.13"
          - "1"
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    
        arch:
          - x64
        allow_failure: [false]

